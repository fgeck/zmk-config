name: Draw ZMK keymaps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "keymap_drawer.config.yaml"
      - "scripts/*.py"
      - "docs/keymap-drawer/anywhy_flake_m.json"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install keymap-drawer pyyaml

      - name: Generate per-layer SVGs
        run: |
          # Base layer with combos
          keymap -c keymap_drawer.config.yaml parse -z config/anywhy_flake.keymap \
            | python scripts/generate-layer-images.py Base --with-combos \
            | keymap -c keymap_drawer.config.yaml draw - -o docs/keymap-drawer/layer-base.svg

          # Num layer
          keymap -c keymap_drawer.config.yaml parse -z config/anywhy_flake.keymap \
            | python scripts/generate-layer-images.py Num \
            | keymap -c keymap_drawer.config.yaml draw - -o docs/keymap-drawer/layer-num.svg

          # Nav layer
          keymap -c keymap_drawer.config.yaml parse -z config/anywhy_flake.keymap \
            | python scripts/generate-layer-images.py Nav \
            | keymap -c keymap_drawer.config.yaml draw - -o docs/keymap-drawer/layer-nav.svg

          # Fn layer
          keymap -c keymap_drawer.config.yaml parse -z config/anywhy_flake.keymap \
            | python scripts/generate-layer-images.py Fn \
            | keymap -c keymap_drawer.config.yaml draw - -o docs/keymap-drawer/layer-fn.svg

          # Idea layer
          keymap -c keymap_drawer.config.yaml parse -z config/anywhy_flake.keymap \
            | python scripts/generate-layer-images.py Idea \
            | keymap -c keymap_drawer.config.yaml draw - -o docs/keymap-drawer/layer-idea.svg

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update keymap-drawer renders [skip ci]"
          file_pattern: "docs/keymap-drawer/*.svg"
