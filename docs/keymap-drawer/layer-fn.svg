<style>/* inherit to force styles through use tags */
svg path {
    fill: inherit;
}

/* font and background color specifications */
svg.keymap {
    font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
    font-size: 14px;
    font-kerning: normal;
    text-rendering: optimizeLegibility;
    fill: #24292e;
}

/* default key styling */
rect.key {
    fill: #f6f8fa;
}

rect.key, rect.combo {
    stroke: #c9cccf;
    stroke-width: 1;
}

/* default key side styling, only used is draw_key_sides is set */
rect.side {
    filter: brightness(90%);
}

/* color accent for combo boxes */
rect.combo, rect.combo-separate {
    fill: #cdf;
}

/* color accent for held keys */
rect.held, rect.combo.held {
    fill: #fdd;
}

/* color accent for ghost (optional) keys */
rect.ghost, rect.combo.ghost {
    stroke-dasharray: 4, 4;
    stroke-width: 2;
}

text {
    text-anchor: middle;
    dominant-baseline: middle;
}

/* styling for layer labels */
text.label {
    font-weight: bold;
    text-anchor: start;
    stroke: white;
    stroke-width: 4;
    paint-order: stroke;
}

/* styling for optional footer */
text.footer {
    text-anchor: end;
    dominant-baseline: auto;
    stroke: white;
    stroke-width: 4;
    paint-order: stroke;
}

/* styling for combo tap, and key non-tap label text */
text.combo, text.hold, text.shifted, text.left, text.right {
    font-size: 11px;
}

text.hold {
    text-anchor: middle;
    dominant-baseline: auto;
}

text.shifted {
    text-anchor: middle;
    dominant-baseline: hanging;
}

text.left {
    text-anchor: start;
}

text.right {
    text-anchor: end;
}

text.layer-activator {
    text-decoration: underline;
}

/* styling for hold/shifted label text in combo box */
text.combo.hold, text.combo.shifted, text.combo.left, text.combo.right {
    font-size: 8px;
}

/* lighter symbol for transparent keys */
text.trans {
    fill: #7b7e81;
}

/* styling for combo dendrons */
path.combo {
    stroke-width: 1;
    stroke: gray;
    fill: none;
}

/* Start Tabler Icons Cleanup */
/* cannot use height/width with glyphs */
.icon-tabler > path {
    fill: inherit;
    stroke: inherit;
    stroke-width: 2;
}
/* hide tabler's default box */
.icon-tabler > path[stroke="none"][fill="none"] {
    visibility: hidden;
}
/* End Tabler Icons Cleanup */

@media (prefers-color-scheme: dark) {
svg.keymap { fill: #d1d6db; }
rect.key { fill: #3f4750; }
rect.key, rect.combo { stroke: #60666c; }
rect.combo, rect.combo-separate { fill: #1f3d7a; }
rect.held, rect.combo.held { fill: #854747; }
text.label, text.footer { stroke: black; }
text.trans { fill: #7e8184; }
path.combo { stroke: #7f7f7f; }

}
svg.keymap {
  font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
}
/* Home row mods - blue */
.keypos-13 rect, .keypos-14 rect, .keypos-15 rect, .keypos-16 rect,
.keypos-19 rect, .keypos-20 rect, .keypos-21 rect, .keypos-22 rect {
  fill: #cfe2f3;
}
/* Home row mod hold text - same teal as other hold text */
.keypos-13 .hold.glyph, .keypos-22 .hold.glyph { fill: #00838f; }
/* Tap-dance double-tap legends - purple text */
.keypos-7 text.key.shifted, .keypos-9 text.key.shifted, .keypos-13 text.key.shifted,
.keypos-22 text.key.shifted, .keypos-23 text.key.shifted, .keypos-24 text.key.shifted,
.keypos-32 text.key.shifted, .keypos-33 text.key.shifted, .keypos-34 text.key.shifted,
.keypos-35 text.key.shifted { fill: #7b1fa2; }
/* Shift+tap legends (BT Clr) - orange text */
.keypos-6 text.key.shifted, .keypos-18 text.key.shifted,
.keypos-30 text.key.shifted { fill: #e65100; }
/* Hold legends (Nav arrows ⌘←, ⌥⌫, etc.) - teal text */
text.key.hold { fill: #00838f; }

/* Transparent keys - light gray */
rect.trans { fill: #f3f3f3; }
/* Ghost/empty keys */
rect.ghost { fill: #fafafa; }
/* Layer activators - green */
.layer-activator rect { fill: #d9ead3; }
/* Combo boxes - yellow */
rect.combo { fill: #fff2cc; }
/* Held keys (layer active) */
rect.held { fill: #e6b8af; }
/* Dark mode */
@media (prefers-color-scheme: dark) {
  .keypos-13 rect, .keypos-14 rect, .keypos-15 rect, .keypos-16 rect,
  .keypos-19 rect, .keypos-20 rect, .keypos-21 rect, .keypos-22 rect {
    fill: #1a3a5c;
  }
  .keypos-13 .hold.glyph, .keypos-22 .hold.glyph { fill: #4dd0e1; }
  .keypos-7 text.key.shifted, .keypos-9 text.key.shifted, .keypos-13 text.key.shifted,
  .keypos-22 text.key.shifted, .keypos-23 text.key.shifted, .keypos-24 text.key.shifted,
  .keypos-32 text.key.shifted, .keypos-33 text.key.shifted, .keypos-34 text.key.shifted,
  .keypos-35 text.key.shifted { fill: #ce93d8; }
  .keypos-6 text.key.shifted, .keypos-18 text.key.shifted,
  .keypos-30 text.key.shifted { fill: #ffb74d; }
  text.key.hold { fill: #4dd0e1; }

  rect.trans { fill: #2a2a2a; }
  rect.ghost { fill: #1a1a1a; }
  .layer-activator rect { fill: #274e13; }
  rect.combo { fill: #7f6000; }
  rect.held { fill: #5b3a3a; }
}
</style>
